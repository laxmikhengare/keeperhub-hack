<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <rect width="480" height="480" rx="96" fill="#10161c"/>
  <!-- lever frame: five cleared levers, one barred -->
  <g stroke="#2a3644" stroke-width="2" fill="none">
    <rect x="72" y="128" width="336" height="232" rx="12"/>
  </g>
  <!-- cleared levers -->
  <g>
    <g transform="translate(122,0)">
      <rect x="-5" y="196" width="10" height="112" rx="5" fill="#1f2c39" stroke="#2a3644" stroke-width="2"/>
      <circle cx="0" cy="188" r="17" fill="#4d9d74"/>
    </g>
    <g transform="translate(181,0)">
      <rect x="-5" y="196" width="10" height="112" rx="5" fill="#1f2c39" stroke="#2a3644" stroke-width="2"/>
      <circle cx="0" cy="188" r="17" fill="#4d9d74"/>
    </g>
    <g transform="translate(240,0)">
      <rect x="-5" y="196" width="10" height="112" rx="5" fill="#1f2c39" stroke="#2a3644" stroke-width="2"/>
      <circle cx="0" cy="188" r="17" fill="#4d9d74"/>
    </g>
    <g transform="translate(299,0)">
      <rect x="-5" y="196" width="10" height="112" rx="5" fill="#1f2c39" stroke="#2a3644" stroke-width="2"/>
      <circle cx="0" cy="188" r="17" fill="#d9a441"/>
    </g>
  </g>
  <!-- the locked lever -->
  <g transform="translate(358,0)">
    <rect x="-5" y="196" width="10" height="112" rx="5" fill="#1f2c39" stroke="#2a3644" stroke-width="2" opacity=".6"/>
    <circle cx="0" cy="188" r="17" fill="#5b6674"/>
  </g>
  <!-- the bar: the interlock -->
  <rect x="330" y="236" width="58" height="13" rx="3" fill="#c8342b"/>
  <rect x="330" y="236" width="58" height="13" rx="3" fill="none" stroke="#7d1f18" stroke-width="2"/>
  <!-- plate -->
  <rect x="72" y="378" width="336" height="46" rx="6" fill="#e9e5da"/>
  <text x="240" y="409" text-anchor="middle" fill="#10161c"
        font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700"
        letter-spacing="7">UNDERSTUDY</text>
</svg>
